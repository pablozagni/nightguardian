name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env && php artisan key:generate
      - run: composer analyse

  tests:
    name: tests (PHP ${{ matrix.php }}, ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db:
          - { name: 'MySQL 8.0', image: 'mysql:8.0', driver: 'mysql' }
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11', driver: 'mariadb' }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: nightguardian_test
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: nightguardian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.driver == 'mariadb' && 'healthcheck.sh --connect --innodb_initialized' || 'mysqladmin ping -h 127.0.0.1 -psecret' }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: nightguardian_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, mbstring, zlib
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env && php artisan key:generate
      - run: composer test

  docker:
    # The image builds and the trial stack (app, worker, scheduler, database) comes up healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build app db
      - name: Wait for the web app to be healthy
        run: |
          for i in $(seq 1 60); do
            [ "$(docker compose ps app --format '{{.Health}}')" = "healthy" ] && exit 0
            sleep 5
          done
          echo "the web app did not become healthy" >&2; exit 1
      - run: docker compose up -d worker scheduler
      - name: The panel answers
        run: |
          curl -fsS -o /dev/null -w "login: %{http_code} " http://localhost:8080/login
          curl -fsS -o /dev/null -w "up: %{http_code} " http://localhost:8080/up
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/ingest)" = "401"
      - name: Worker and scheduler are running
        run: |
          docker compose ps --format '{{.Service}} {{.State}}'
          test "$(docker compose ps --format '{{.Service}} {{.State}}' | grep -c ' running')" -ge 4
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
